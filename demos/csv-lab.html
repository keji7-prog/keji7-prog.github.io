<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSV Data Lab · Keji Portfolio</title><link rel="stylesheet" href="../assets/style.css"><style>
.lab{max-width:1050px;margin:65px auto 100px}.lab h1{font-size:47px;line-height:1.2;margin:13px 0}.lab-description{color:#9aafbe;line-height:1.9}.lab-actions{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0}.file-pick{background:#a0e2c4;color:#17261f;padding:13px 20px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer}.file-pick input{display:none}.lab-btn{padding:13px 20px;border-radius:8px;background:#232e3c;border:1px solid #52606b;color:#d2e0ea;font-size:12px}.lab-status{color:#a2b1c0;font-size:12px;min-height:30px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:25px}.metric{background:#1b2732;border:1px solid #3d4e5a;border-radius:10px;padding:22px}.metric small{font-size:11px;color:#9daebb}.metric strong{font-size:30px;display:block;margin-top:4px}.lab-panel{border:1px solid #364652;background:#1c2732;border-radius:12px;padding:22px;margin-top:20px}.lab-panel h2{font-size:19px;margin:0 0 19px}.bar-chart{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:170px 1fr 70px;gap:12px;align-items:center;font-size:12px}.bar-label{color:#bfcfdb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{background:#35444f;height:19px;border-radius:3px;overflow:hidden}.bar-fill{background:linear-gradient(90deg,#428e93,#a0e2c4);height:100%;border-radius:3px}.bar-value{color:#9fc7b9;text-align:right}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}th,td{border-bottom:1px solid #364550;text-align:left;padding:9px 15px}th{color:#b7d6cc;background:#273744}td{color:#aebdc9}.lab-panel .tip{font-size:11px;color:#7894a3;margin-top:12px}.field-select{background:#263642;color:white;border:1px solid #54636b;border-radius:6px;padding:9px 13px;margin-bottom:18px}@media(max-width:650px){.lab{margin-top:35px}.lab h1{font-size:34px}.metric-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:88px 1fr 50px;gap:7px}.bar-value{font-size:10px}.lab-panel{padding:14px}}</style></head>
<body><header class="site-nav"><div class="wrap nav-inner"><a class="wordmark" href="../index.html"><span class="mark">K<span class="mark-dot">.</span></span><span class="wordmark-text">KEJI / PORTFOLIO</span></a><nav class="nav-links" style="display:flex"><a href="../index.html">首页</a><a href="../opensource.html">数据项目</a></nav></div></header>
<main class="wrap lab"><p class="kicker">INTERACTIVE PROJECT / CSV DATA LAB</p><h1>让 CSV 数据<br><span style="color:#a0e2c4">更容易读懂。</span></h1><p class="lab-description">读取 GitHub 公开仓库数据或自行导入 CSV 文件，识别字段、预览记录和分析数值分布。自选文件在浏览器本地处理，不上传服务器。</p>
<div class="lab-actions"><label class="file-pick">选择 CSV 文件<input type="file" id="pick" accept=".csv,text/csv"></label><button id="sample" class="lab-btn" type="button">加载 GitHub 公开数据</button><button id="clear" class="lab-btn" type="button">清空</button></div><div class="lab-status" id="message" aria-live="polite">加载公开仓库数据，或选择本地 CSV 文件。</div>
<div class="metric-grid"><div class="metric"><small>记录数量（不含表头）</small><strong id="rows">—</strong></div><div class="metric"><small>识别字段</small><strong id="cols">—</strong></div><div class="metric"><small>可统计数值列</small><strong id="nums">—</strong></div></div>
<div class="lab-panel"><h2>数值列 · 分类分布</h2><select id="field" class="field-select" aria-label="选择数值字段"><option value="">请先加载 CSV</option></select><div id="bars" class="bar-chart"><p style="color:#7891a0">暂无数据。</p></div><p class="tip">仅按前 2,000 行预览统计；图表将数值按大小区间计数，不代表业务因果。</p></div>
<div class="lab-panel"><h2>表格预览 <span style="font-weight:400;font-size:11px;color:#7b95a4">/ 前 12 行</span></h2><div id="table" class="table-scroll">暂无数据。</div></div></main>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x);let headers=[],data=[];
function fromOfficial(records){const columns=['repo','stars','forks','issues','language','category'];function q(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}return columns.join(',')+'\n'+records.map(r=>columns.map(k=>q(r[k])).join(',')).join('\n')}
function parseCSV(input){let rows=[],row=[],cell='',quoted=false;input=input.replace(/^\uFEFF/,'');for(let i=0;i<input.length;i++){let c=input[i];if(c==='"'){if(quoted&&input[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&input[i+1]==='\n')i++;row.push(cell);if(row.some(s=>s!==''))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV 引号未正确闭合');row.push(cell);if(row.some(s=>s!==''))rows.push(row);return rows}
function numFields(){return headers.map((h,i)=>({h,i})).filter(x=>data.length>0&&data.filter(r=>r[x.i]?.trim()!=='').every(r=>/^[-+]?\d+(?:\.\d+)?$/.test((r[x.i]||'').trim())))}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(){let nums=numFields();$('rows').textContent=data.length.toLocaleString();$('cols').textContent=headers.length;$('nums').textContent=nums.length;$('field').innerHTML=nums.length?nums.map(n=>`<option value="${n.i}">${escape(n.h)}</option>`).join(''):'<option value="">无纯数值字段</option>';
$('table').innerHTML='<table><thead><tr>'+headers.map(x=>'<th>'+escape(x)+'</th>').join('')+'</tr></thead><tbody>'+data.slice(0,12).map(r=>'<tr>'+headers.map((h,i)=>'<td>'+escape(r[i]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';$('field').disabled=!nums.length;bars();}
function bars(){let id=$('field').value;if(id===''){$('bars').innerHTML='<p style="color:#7891a0">没有能够统计的数值列。</p>';return}let vals=data.slice(0,2000).map(r=>Number(r[Number(id)])).filter(Number.isFinite);if(!vals.length)return;let mn=Math.min(...vals),mx=Math.max(...vals);let bins=Array(5).fill(0);for(let v of vals)bins[mn===mx?0:Math.min(4,Math.floor((v-mn)/(mx-mn)*5))]++;let max=Math.max(...bins);$('bars').innerHTML=bins.map((v,i)=>{let lo=mn+(mx-mn)*i/5,hi=mn+(mx-mn)*(i+1)/5;let label=mn===mx?`${mn.toFixed(1)}（全部）`:`${lo.toFixed(1)}–${hi.toFixed(1)}`;return `<div class="bar-row"><span class="bar-label">${i===0&&mn===mx?label:mn===mx?'—':label}</span><div class="bar-track"><div class="bar-fill" style="width:${(v/max)*100}%"></div></div><span class="bar-value">${v}</span></div>`}).join('')}
function load(text,name){try{let rows=parseCSV(text);if(rows.length<2)throw Error('至少需要表头与一行数据');headers=rows[0].map(s=>s.trim());if(headers.length>80)throw Error('字段过多（最多 80 列）');data=rows.slice(1).map(r=>headers.map((_,i)=>(r[i]??'').trim()));$('message').textContent=`已加载 ${name}；仅在本地浏览器处理。`;show()}catch(e){$('message').textContent='无法读取：'+e.message}}
$('sample').addEventListener('click',async()=>{ $('message').textContent='正在获取 GitHub 公开仓库数据…';try{const response=await fetch('../data/github_repos_snapshot.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const payload=await response.json();if(!Array.isArray(payload.records)||!payload.records.length)throw Error('未取得仓库记录');load(fromOfficial(payload.records),'GitHub REST API 仓库数据');}catch(e){$('message').textContent='数据加载失败：'+e.message;}});
$('clear').addEventListener('click',()=>{headers=[];data=[];$('rows').textContent=$('cols').textContent=$('nums').textContent='—';$('field').innerHTML='<option>请先加载 CSV</option>';$('bars').textContent=$('table').textContent='暂无数据。';$('message').textContent='已清空。'});
$('field').addEventListener('change',bars);
$('pick').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){$('message').textContent='文件过大：请使用 5 MB 以下的 CSV。';return}let text=await f.text();load(text,f.name);e.target.value=''});
})();
</script></body></html>
