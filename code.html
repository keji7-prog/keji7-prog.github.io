<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JK Python 开源数据获取、数据分析与桌面应用项目源代码。"><title>Project Source · JK</title><link rel="stylesheet" href="assets/portfolio.css"></head><body><header class="site-header"><div class="shell header-inner"><a href="index.html" class="brand"><span class="brand-icon">K.</span><span>JK<small>PYTHON / DATA / SYSTEMS</small></span></a><button class="menu-toggle" id="menu-toggle" aria-label="展开菜单" aria-expanded="false">☰</button><nav class="nav-list" id="nav-list"><a href="index.html#projects">所有项目</a><a href="lab.html">互动应用</a><a href="code.html">项目代码</a><a href="opensource.html">数据作品</a><a href="https://github.com/keji7-prog" target="_blank" rel="noopener">GitHub ↗</a></nav></div></header><main><div class="shell"><section class="subhero"><a class="breadcrumb" href="index.html">← 返回所有项目</a><div class="eyebrow" style="margin-top:27px">PYTHON / SOURCE CODE</div><h1>项目源代码。</h1><p>浏览数据采集、统计分析和桌面程序的实际 Python 源码。点击文件名称查看内容，或打开 GitHub 仓库检查历史版本。</p></section><div class="layout-two"><aside class="sidepane" id="files" style="max-height:72vh;overflow:auto"><div class="eyebrow" style="margin:0 0 15px">PROJECT FILES</div><button type="button" data-file="scripts/collect_github_repos.py" style="margin-bottom:8px;text-align:left"><strong>GitHub API 数据采集</strong><small style="display:block;color:var(--muted);font-size:11px">调用公开 REST API 取得仓库指标</small></button><button type="button" data-file="scripts/analyze_github_repos.py" style="margin-bottom:8px;text-align:left"><strong>GitHub 数据分析</strong><small style="display:block;color:var(--muted);font-size:11px">对采集的仓库数据进行分类与统计</small></button><button type="button" data-file="scripts/verified_calculator.py" style="margin-bottom:8px;text-align:left"><strong>Tkinter Calculator</strong><small style="display:block;color:var(--muted);font-size:11px">桌面应用与表达式运算</small></button><button type="button" data-file="scripts/test_verified_calculator.py" style="margin-bottom:8px;text-align:left"><strong>Calculator Tests</strong><small style="display:block;color:var(--muted);font-size:11px">自动运算验证代码</small></button></aside><div><div class="panel"><div class="eyebrow">PYTHON SOURCE</div><h2 id="filename" style="overflow-wrap:anywhere">选择项目</h2><div class="control-row" style="margin-top:17px"><a class="btn dark" id="source-link" href="https://github.com/keji7-prog/keji7-prog.github.io" target="_blank" rel="noopener">GitHub 源文件 ↗</a><button class="btn dark" id="copy" type="button">复制代码</button></div><p class="result-message" id="source-status"></p></div><div class="code-window" style="margin-top:15px"><pre id="source-display" style="white-space:pre-wrap;overflow-wrap:anywhere">选择左侧文件。</pre></div></div></div></div></main><footer class="footer"><div class="shell footrow"><span>© 2026 JK</span><a href="index.html">返回首页 ↑</a></div></footer><script>document.getElementById('menu-toggle').addEventListener('click',()=>{const n=document.getElementById('nav-list'),o=n.classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',o)});const allowed=["scripts/collect_github_repos.py","scripts/analyze_github_repos.py","scripts/verified_calculator.py","scripts/test_verified_calculator.py"];const view=document.getElementById('source-display'),title=document.getElementById('filename'),status=document.getElementById('source-status');async function openFile(path){if(!allowed.includes(path))return;title.textContent=path.split('/').pop();view.textContent='正在读取…';const buttons=document.querySelectorAll('button[data-file]');buttons.forEach(b=>b.classList.toggle('active',b.dataset.file===path));document.getElementById('source-link').href='https://github.com/keji7-prog/keji7-prog.github.io/blob/main/'+path;try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const code=await r.text();view.textContent=code;status.textContent=code.split('\n').length+' 行 · Python';history.replaceState(null,'','?path='+encodeURIComponent(path));}catch(e){view.textContent='无法加载文件，可通过 GitHub 源文件链接查看。';status.textContent=e.message;}}document.getElementById('files').addEventListener('click',e=>{const b=e.target.closest('button[data-file]');if(b)openFile(b.dataset.file)});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(view.textContent);status.textContent='已复制'}catch(e){status.textContent='请手动选中复制'}});const chosen=new URLSearchParams(location.search).get('path');openFile(allowed.includes(chosen)?chosen:allowed[0]);</script></body></html>
